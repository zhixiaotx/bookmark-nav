name: Build & Deploy to GitHub Pages

# 触发条件：
#   - push 到 main 或 master 分支
#   - 手动触发 (Actions 页面 Run workflow)
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write # 允许推送 gh-pages 分支

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - uses: actions/checkout@v4

      # 2. 安装 Node
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 安装依赖（使用 lockfile，安装更快更稳）
      - run: npm ci

      # 4. 打包，输出到 dist/ 目录
      - run: npm run build

      # 5. 把 dist/ 打包推送到 gh-pages 分支，然后由 GitHub Pages 部署
      #    首次使用请到 仓库 Settings → Pages → Build and deployment → Source 选择 "Deploy from a branch" 当前分支选 gh-pages / (root)
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true # 每次用全新提交，避免历史文件残留
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'